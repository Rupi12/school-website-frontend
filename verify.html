<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Receipt Verification - AJS</title></head>
<body>
  <div id="result">Verifying…</div>
  <script>
    const API = "http://localhost:5000"; // change to your live backend URL on deploy
    const receiptNo = location.pathname.split('/').pop();
    fetch(`${API}/api/student-admin/verify-receipt/${receiptNo}`)
      .then(r => r.json())
      .then(d => {
        document.getElementById('result').innerHTML = d.valid
          ? `✅ Valid Receipt<br>${d.studentName} (${d.class})<br>${d.category} • ₹${d.amount} • ${new Date(d.date).toLocaleDateString('en-IN')}`
          : `❌ Invalid or unknown receipt`;
      });
  </script>
</body>
</html>
