<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Verification - Amar Jyoti School</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f1f5f9;
            margin: 0; padding: 0;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 2rem; max-width: 400px; width: 90%; text-align: center;
        }
        .icon { font-size: 4rem; margin-bottom: 1rem; }
        h2 { color: #1e293b; margin: 0 0 1rem 0; }
        .details { text-align: left; background: #f8fafc; padding: 1rem; border-radius: 8px; margin-top: 1rem; border: 1px solid #e2e8f0; }
        .row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .row strong { color: #475569; }
        .row span { color: #0f172a; font-weight: 600; text-align: right; }
        .valid { color: #10b981; }
        .invalid { color: #ef4444; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card" id="resultCard">
        <div class="spinner"></div>
        <h2>Verifying...</h2>
        <p style="color:#6b7280">Please wait while we check our secure database.</p>
    </div>

    <script>
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:5000/api'
            : 'https://school-website-backend-j6pc.onrender.com/api';

        async function verifyDocument() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const card = document.getElementById('resultCard');

            if (!id) {
                card.innerHTML = `<div class="icon invalid">❌</div><h2 class="invalid">Invalid QR Code</h2><p>No document ID was found in the URL.</p>`;
                return;
            }

            try {
                // Note: If you add NOC verification later, you can expand this to check NOCs too.
                const res = await fetch(`${API_URL}/student-admin/verify-receipt/${encodeURIComponent(id)}`);
                const data = await res.json();

                if (data.valid) {
                    card.innerHTML = `
                        <div class="icon valid">✅</div>
                        <h2 class="valid">Authentic Receipt</h2>
                        <p style="color:#6b7280; font-size:0.9rem; margin-top:-0.5rem">This document has been verified against our secure database.</p>
                        <div class="details">
                            <div class="row"><strong>Receipt No:</strong> <span>${data.receiptNo}</span></div>
                            <div class="row"><strong>Student:</strong> <span>${data.studentName}</span></div>
                            <div class="row"><strong>Class:</strong> <span>${data.class}</span></div>
                            <div class="row"><strong>Category:</strong> <span>${data.category}</span></div>
                            <div class="row"><strong>Amount Paid:</strong> <span>₹${data.amount}</span></div>
                            <div class="row"><strong>Date:</strong> <span>${new Date(data.date).toLocaleDateString()}</span></div>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="icon invalid">❌</div>
                        <h2 class="invalid">Verification Failed</h2>
                        <p style="color:#475569">We could not find this document in our system. It may be forged or canceled.</p>
                    `;
                }
            } catch (err) {
                card.innerHTML = `
                    <div class="icon invalid">⚠️</div>
                    <h2 class="invalid">Connection Error</h2>
                    <p>Could not connect to the school server. Please try again later.</p>
                `;
            }
        }
        verifyDocument();
    </script>
</body>
</html>
