<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Amar Jyoti School</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/styles.css?v=33">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Poppins', sans-serif; }
        .login-container { 
            min-height: 100vh;
            display: flex;
            align-items: center; 
            justify-content: center;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(30, 58, 138, 0.75) 100%), 
                        url('https://images.unsplash.com/photo-1541829070764-84a7d30dd3f3?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            padding: 1rem;
        }
        .login-box { 
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.6);
            border: none;
            width: 100%;
            max-width: 420px;
        }
        .login-box .form-group { margin-bottom: 1.5rem; }
        .login-box label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #334155; font-size: 0.9rem; }
        .login-box input {
            width: 100%; padding: 0.85rem 1rem; border: 2px solid #e2e8f0;
            border-radius: 12px; font-size: 1rem; font-family: inherit;
            box-sizing: border-box; background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }
        .login-box input:focus { 
            outline: none; border-color: #3b82f6; background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }
        .login-box button {
            width: 100%; padding: 0.9rem; background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        .login-box button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4); }
        .form-message { margin-top: 1rem; padding: 0.8rem; border-radius: 5px; text-align: center; display: none; }
        .form-message.error { display: block; background: #fee2e2; color: #991b1b; }
        .back-link { text-align: center; margin-top: 1rem; }
        .back-link a { color: #2563eb; text-decoration: none; }
        @media (max-width: 480px) {
            .login-box { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <!-- Centered Premium Logo -->
            <div style="display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 1.5rem;">
                <img src="favicon.svg" alt="Amar Jyoti School Logo" style="height: 85px; width: 85px; object-fit: contain; margin-bottom: 0.5rem;">
                <h2 style="margin: 0 !important; font-family: 'Poppins', sans-serif; font-size: 1.35rem; font-weight: 800; line-height: 1.2; color: #0f172a !important;">AMAR JYOTI SCHOOL</h2>
                <small style="color:#6b7280; font-family: 'Poppins', sans-serif; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px; margin-top: 4px;">GOPALGARH, PAHARI (RAJ.)</small>
            </div>
            
            <!-- Login Subtitle -->
            <div style="text-align: center; margin-bottom: 2rem; color: #3b82f6; font-weight: 700; font-size: 0.85rem; letter-spacing: 1.5px; text-transform: uppercase;">
                Student Login Portal
            </div>
            <form id="studentLoginForm">
                <div class="form-group">
                    <label>Roll Number</label>
                    <input type="text" name="rollNumber" required autofocus>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <div id="loginMessage" class="form-message"></div>
            <div class="back-link"><a href="index.html">← Back to Website</a></div>
        </div>
    </div>

    <script>
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:5000/api'
            : 'https://school-website-backend-j6pc.onrender.com/api';

        if (localStorage.getItem('studentToken')) window.location.href = 'student-dashboard.html';

        document.getElementById('studentLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            const msg = document.getElementById('loginMessage');
            try {
                const res = await fetch(`${API_URL}/student/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.success) {
                    localStorage.setItem('studentToken', result.token);
                    localStorage.setItem('studentInfo', JSON.stringify(result.student));
                    window.location.href = 'student-dashboard.html';
                } else {
                    msg.className = 'form-message error';
                    msg.textContent = '❌ ' + result.message;
                }
            } catch (error) {
                msg.className = 'form-message error';
                msg.textContent = '❌ Server error';
            }
        });
    </script>
</body>
</html>
