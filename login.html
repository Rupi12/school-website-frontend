<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Amar Jyoti School</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Poppins', sans-serif; }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            padding: 1rem;
        }
        .login-box {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-box h2 { text-align: center; margin-bottom: 0.5rem; color: #2563eb; }
        .login-box p { text-align: center; color: #6b7280; margin-bottom: 2rem; }
        .login-box .form-group { margin-bottom: 1.2rem; }
        .login-box label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        .login-box input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
        }
        .login-box input:focus { outline: none; border-color: #2563eb; }
        .login-box button {
            width: 100%;
            padding: 0.8rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-box button:hover { background: #1d4ed8; }
        .login-box button:disabled { background: #9ca3af; cursor: not-allowed; }
        .form-message {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        .form-message.error { display: block; background: #fee2e2; color: #991b1b; }
        .form-message.success { display: block; background: #d1fae5; color: #065f46; }
        .back-link { text-align: center; margin-top: 1rem; }
        .back-link a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <!-- Centered Premium Logo -->
            <div style="display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 1.5rem;">
                <img src="favicon.svg" alt="Amar Jyoti School Logo" style="height: 85px; width: 85px; object-fit: contain; margin-bottom: 0.5rem;">
                <h2 style="margin: 0 !important; font-family: 'Poppins', sans-serif; font-size: 1.35rem; font-weight: 800; line-height: 1.2; color: #0f172a !important;">AMAR JYOTI SCHOOL</h2>
                <small style="color:#6b7280; font-family: 'Poppins', sans-serif; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px; margin-top: 4px;">GOPALGARH, PAHARI (RAJ.)</small>
            </div>
            
            <!-- Login Subtitle -->
            <div style="text-align: center; margin-bottom: 1.5rem; color: #2563eb; font-weight: 600; font-size: 1.1rem;">
                Staff Login Portal
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" id="loginBtn">Login</button>
            </form>
            <div id="loginMessage" class="form-message"></div>
            <div class="back-link">
                <a href="index.html">← Back to Website</a>
            </div>
        </div>
    </div>

    <script>
        // Auto-detect environment (works on both local and production)
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:5000/api'
            : 'https://school-website-backend-j6pc.onrender.com/api';

        // If already logged in, redirect to admin
        if (localStorage.getItem('adminToken')) {
            window.location.href = 'admin.html';
        }

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData);
    const msg = document.getElementById('loginMessage');
    const btn = document.getElementById('loginBtn');

    btn.disabled = true;
    btn.textContent = 'Logging in...';
    msg.style.display = 'none';

    try {
        const response = await fetch(`${API_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
            localStorage.setItem('adminToken', result.token);
            localStorage.setItem('adminInfo', JSON.stringify(result.admin));
            msg.className = 'form-message success';
            msg.style.display = 'block';
            msg.textContent = '✅ Login successful! Redirecting...';
            setTimeout(() => window.location.href = 'admin.html', 1000);
        } else {
            msg.className = 'form-message error';
            msg.style.display = 'block';
            msg.textContent = '❌ ' + (result.message || 'Login failed');
            btn.disabled = false;
            btn.textContent = 'Login';
        }
    } catch (error) {
        msg.className = 'form-message error';
        msg.style.display = 'block';
        msg.textContent = '❌ Server error. Make sure backend is running.';
        btn.disabled = false;
        btn.textContent = 'Login';
    }
});
    </script>
</body>
</html>
