<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/styles.css?v=23">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, rgba(241, 245, 249, 0.88) 0%, rgba(255, 255, 255, 0.92) 100%), 
                        url('https://images.unsplash.com/photo-1541829070764-84a7d30dd3f3?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            margin: 0; font-family: 'Poppins', sans-serif; 
        }
        .sd-container { max-width: 1100px; margin: auto; padding: 2rem; } 
        .sd-header { 
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 1.5rem 2rem; border-radius: 20px; border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 10px 30px -10px rgba(37, 99, 235, 0.15); margin-bottom: 2rem; 
        }
        .sd-header h1 { margin: 0; color: #2563eb; font-size: 1.4rem; }
        .logout-btn { 
            padding: 0.6rem 1.8rem; background: linear-gradient(135deg, #ef4444, #dc2626); color: white; 
            border: none; border-radius: 50px; cursor: pointer; font-weight: 600; 
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); transition: all 0.3s ease; 
        }
        .logout-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4); }
        .sd-tabs { display: inline-flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; background: #e2e8f0; padding: 0.4rem; border-radius: 14px; }
        .sd-tab { padding: 0.7rem 1.4rem; border: none; background: transparent; color: #475569; border-radius: 10px; cursor: pointer; font-weight: 600; font-family: inherit; transition: all 0.3s ease; }
        .sd-tab:hover { color: #1e293b; }
        .sd-tab.active { background: white; color: #2563eb; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08); }
        .sd-panel { background: white; padding: 1.5rem; border-radius: 20px; border: 1px solid #e2e8f0; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); overflow-x: auto; }
        .sd-panel.hidden { display: none; }
        table { width: 100%; border-collapse: collapse; }
        th { 
            background: #f1f5f9; color: #475569; padding: 1rem; text-align: left; 
            font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; border-bottom: 2px solid #e2e8f0; 
        }
        td { padding: 1.2rem 1rem; border-bottom: 1px solid #f1f5f9; color: #334155; }
        .badge { padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .paid { background: #d1fae5; color: #065f46; }
        .pending { background: #fee2e2; color: #991b1b; }
        .present { background: #d1fae5; color: #065f46; }
        .absent { background: #fee2e2; color: #991b1b; }
        .stat-big { font-size: 2.5rem; color: #2563eb; font-weight: 700; }
        @media (max-width: 600px) {
            .sd-header { flex-direction: column; align-items: flex-start; }
            .sd-actions { width: 100%; flex-direction: column !important; align-items: stretch !important; gap: 0.5rem !important; }
            .logout-btn, #changePwdBtn { width: 100%; margin: 0 !important; }
            .sd-tabs { display: grid; grid-template-columns: 1fr; width: 100%; gap: 0.5rem; }
            .sd-tab { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="sd-container">
        <div class="sd-header">
    <!-- Logo & Student Info -->
    <div style="display: flex; align-items: center; gap: 1rem;">
        <img src="favicon.svg" alt="Logo" style="height: 60px; width: 60px; object-fit: contain; flex-shrink: 0;">
        <div style="display: flex; flex-direction: column; justify-content: center;">
            <h2 style="margin: 0; font-family: 'Poppins', sans-serif; font-size: 1.15rem; font-weight: 800; color: #0f172a;">AMAR JYOTI SCHOOL</h2>
            <small style="color:#2563eb; font-weight: 600;">Student Dashboard</small>
            <div id="studentInfo" style="color:#6b7280; font-size: 0.85rem;"></div>
        </div>
    </div>

    <!-- Actions -->
    <div class="sd-actions" style="display: flex; align-items: center; gap: 1rem;">
        <button id="changePwdBtn" onclick="openStudentChangePassword()" style="padding:0.4rem 0.8rem;background:#f3f4f6;color:#374151;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-size:0.85rem;font-family:inherit;font-weight:600;">🔑 Change Password</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

        <div class="sd-tabs">
            <button class="sd-tab active" onclick="showPanel('results', this)">📊 Results</button>
            <button class="sd-tab" onclick="showPanel('attendance', this)">📅 Attendance</button>
            <button class="sd-tab" onclick="showPanel('timetable', this)">🗓️ Timetable</button>
            <button class="sd-tab" onclick="showPanel('fees', this)">💰 Fees</button>
            <button class="sd-tab" onclick="showPanel('documents', this)">📄 Documents</button>
        </div>

        <div id="results-panel" class="sd-panel"></div>
        <div id="attendance-panel" class="sd-panel hidden"></div>
        <div id="timetable-panel" class="sd-panel hidden"></div>
        <div id="fees-panel" class="sd-panel hidden"></div>
        <div id="documents-panel" class="sd-panel hidden"></div>
    </div>

    <script src="js/student-dashboard.js"></script>
</body>
</html>
